plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // BIN keeps the wrapper download small; ALL adds Gradle's sources for IDE documentation.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// Game tests load into every dev run as part of the mod, but are never packaged into the jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
}

repositories {
    // JEI and Patchouli, optional integrations.
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
            includeGroupAndSubgroups "net.mezzdev"
            includeGroup "vazkii.patchouli"
        }
    }
    maven {
        url "https://cursemaven.com"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runClient -Pvisuals=adapters,guide (or all) runs VisualCheck's shots for those areas.
            if (project.hasProperty('visuals')) {
                systemProperty 'ec.visualcheck', 'true'
                systemProperty 'ec.visualcheck.only', project.property('visuals').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runGameTestServer -Ptests=crafting,network runs only those categories.
            systemProperty 'ec.tests', (project.findProperty('tests') ?: '').toString()
            // Its own directory, so tests never share a world with runServer's.
            gameDirectory = project.file('run/gametest')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

// localRuntime: present in dev runs, but not pulled in by mods that depend on this one.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI is optional: compiled against its API, and only run in dev.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // Patchouli is optional too: when it's installed the guides open its handbook.
    compileOnly "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-NEOFORGE:api"
    localRuntime "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-NEOFORGE"
    gametestCompileOnly "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-NEOFORGE:api"
    implementation "curse.maven:iron-generators-446489:8679261"
    implementation "curse.maven:inzhefop-core-434516:8702521"
}

// Fills the ${} properties into src/main/templates; a missing one is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
// Runs on every IDE sync, so it never needs running by hand.
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer downloads dependency sources and javadoc on its own.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Test worlds are deleted before and after every run, so nothing a test leaves behind affects the next.
tasks.register('cleanGameTestWorld', Delete) {
    delete 'run/gametest/world'
}
tasks.register('cleanVisualCheckWorld', Delete) {
    delete 'run/saves/ec_visualcheck'
}
tasks.named('runGameTestServer') {
    def world = file('run/gametest/world')
    doFirst { world.deleteDir() }
    finalizedBy 'cleanGameTestWorld'
}
tasks.named('runClient') {
    finalizedBy 'cleanVisualCheckWorld'
}
