org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Must agree with neo_version. Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
# Release versions only: snapshots and pre-releases don't sort reliably.
minecraft_version_range=[1.21.1]
neo_version=21.1.249
# FML major versions only.
loader_version_range=[1,)

## Mod Properties

# Must match EngineeredComputation.MODID.
mod_id=engineered_computation
mod_name=Engineered Computation
mod_license=All Rights Reserved
mod_version=1.4
# Matches the base package; only used when publishing to Maven.
mod_group_id=com.muddykat.engineeredcomputation

# Optional integrations
jei_version=19.57.0.451
patchouli_version=93
ponder_version=1.0.87
flywheel_version=1.0.4
